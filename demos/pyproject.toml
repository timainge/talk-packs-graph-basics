[project]
name = "graphtools"
version = "0.1.0"
description = "Lightweight lib + notebooks for the recipe demos in 'A Practitioner's Guide to Graphs'."
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.14",   # schema-first extraction
    "networkx>=3.2",          # in-memory graph + PPR / shortest-path / VF2 subgraph match
    "numpy>=1.26",
    "scipy>=1.11",            # networkx pagerank/hits backend
    "matplotlib>=3.8",        # notebook figures
    "httpx>=0.27",            # recipe fetching
    "rapidfuzz>=3.9",         # lexical entity resolution
    "pyyaml>=6.0",            # ontology tables
]

[project.optional-dependencies]
# Act II §3 — hybrid (vector + lexical) entity matching. Heavy; install only when needed.
vector = ["sentence-transformers>=2.7"]
# Notebook runtime + test runner. nbstripout strips notebook outputs from git
# (filter wired via the repo-root .gitattributes; install globally with `uv tool install nbstripout`).
dev = ["jupyter>=1.0", "ipykernel>=6.29", "pytest>=8.0", "nbstripout>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphtools"]

[tool.uv]
# `uv sync --extra dev` then `uv run jupyter lab`
